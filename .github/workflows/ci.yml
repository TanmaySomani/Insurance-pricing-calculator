name: Data and pricing model integrity checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps .
      - run: insurance-pricing --help
      - run: python -m pytest -q
      - run: python -m pip install -r requirements-report.txt
      - run: python scripts/build_manager_brief.py
      - run: git diff --exit-code -- output/pdf/pricing_manager_brief.pdf reports/handover/brief_manifest.json
      - run: PYTHONPATH=src python scripts/verify_handover.py --aggregate-only
      - run: PYTHONPATH=src python scripts/package_client.py
